name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Set up Android environment
        run: echo "NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run tauri icon app-icon.png

      - name: Init Android
        run: npm run tauri android init

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/semios-release.keystore"
          printf 'keyAlias=%s\n' '${{ secrets.ANDROID_KEY_ALIAS }}' > src-tauri/gen/android/keystore.properties
          printf 'password=%s\n' '${{ secrets.ANDROID_KEY_PASSWORD }}' >> src-tauri/gen/android/keystore.properties
          printf 'storeFile=%s\n' "$RUNNER_TEMP/semios-release.keystore" >> src-tauri/gen/android/keystore.properties

      - name: Wire signing into Gradle
        run: node scripts/patch-android-signing.mjs src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          built=(src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          if [ "${#built[@]}" -ne 1 ]; then
            echo "expected exactly one release APK, found: ${#built[@]}" >&2
            exit 1
          fi
          echo "built: ${built[0]}"
          apksigner_path="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner_path" verify --verbose --print-certs "${built[0]}"
          mkdir -p dist
          cp "${built[0]}" dist/semios-android.apk
          ls -l dist/semios-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/semios-android.apk
          if-no-files-found: error

  windows:
    name: NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run tauri icon app-icon.png

      - name: Build
        run: npm run tauri build -- --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/semios-windows-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/semios-windows-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Semios ${{ github.ref_name }}" \
            --generate-notes \
            dist/android-apk/semios-android.apk \
            dist/windows-installer/semios-windows-setup.exe
