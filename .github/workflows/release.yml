name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Set up Android environment
        run: echo "NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run tauri icon app-icon.png

      - name: Init Android
        run: npm run tauri android init

      - name: Setup Android signing
        run: |
          printf 'keyAlias=%s\n' '${{ secrets.ANDROID_KEY_ALIAS }}' > src-tauri/gen/android/keystore.properties
          printf 'keyPassword=%s\n' '${{ secrets.ANDROID_KEY_PASSWORD }}' >> src-tauri/gen/android/keystore.properties
          printf 'storeFile=%s\n' "$RUNNER_TEMP/semios-release.keystore" >> src-tauri/gen/android/keystore.properties
          printf 'storePassword=%s\n' '${{ secrets.ANDROID_KEY_PASSWORD }}' >> src-tauri/gen/android/keystore.properties
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/semios-release.keystore"

      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Collect APK
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/semios-android.apk \;

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/semios-android.apk
          if-no-files-found: error

  windows:
    name: NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run tauri icon app-icon.png

      - name: Build
        run: npm run tauri build -- --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/semios-windows-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/semios-windows-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Semios ${{ github.ref_name }}" \
            --generate-notes \
            dist/android-apk/semios-android.apk \
            dist/windows-installer/semios-windows-setup.exe
